services:
  - type: web
    name: opportunity-radar-api
    runtime: python
    plan: free

    rootDir: backend

    buildCommand: >
      pip install -r requirements.txt &&
      playwright install chromium

    startCommand: >
      python -m playwright install chromium &&
      python -m uvicorn main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: CORS_ORIGINS
        value: https://opportunity-radar.vercel.app,http://localhost:5173
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
